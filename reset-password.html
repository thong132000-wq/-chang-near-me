<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ตั้งรหัสผ่านใหม่ | ช่างใกล้ฉัน</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 ตั้งรหัสผ่านใหม่</h1>

    <form onsubmit="resetPassword(event)">

      <label>รหัสผ่านใหม่</label>

      <input
        type="password"
        id="password"
        placeholder="กรอกรหัสผ่านใหม่"
        minlength="6"
        required
      >

      <label>ยืนยันรหัสผ่านใหม่</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="กรอกรหัสผ่านอีกครั้ง"
        minlength="6"
        required
      >

      <button type="submit">
        ตั้งรหัสผ่านใหม่
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://adfnwfdhgqsubmlwdorr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_aWz60lF1KJt-ex5SHsmNpQ_a2SLpDFO";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function resetPassword(event) {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");


      if (password !== confirmPassword) {

        message.innerHTML =
          "❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน";

        return;
      }


      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });


      if (error) {

        message.innerHTML =
          "❌ เปลี่ยนรหัสผ่านไม่สำเร็จ<br>" +
          error.message;

        return;
      }


      message.innerHTML =
        "✅ เปลี่ยนรหัสผ่านสำเร็จแล้วครับ<br>" +
        "กำลังกลับไปหน้าเข้าสู่ระบบ...";


      setTimeout(() => {

        window.location.href = "login.html";

      }, 2000);

    }

  </script>

</body>
</html>
