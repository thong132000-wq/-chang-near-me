<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | ช่างใกล้ฉัน</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f7fa;
      color: #172033;
      min-height: 100vh;
    }
    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }
    .logo {
      font-size: 25px;
      font-weight: bold;
    }
    .container {
      width: 100%;
      max-width: 450px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #f97316;
    }
    .btn {
      width: 100%;
      border: none;
      background: #f97316;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 25px;
      cursor: pointer;
    }
    .register {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
      line-height: 2;
    }
    .register a {
      color: #f97316;
      font-weight: bold;
      text-decoration: none;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #374151;
      text-decoration: none;
    }
    .forgot {
      display: block;
      text-align: right;
      margin-top: 10px;
      color: #f97316;
      font-size: 14px;
      text-decoration: none;
    }
    .note {
      background: #fff7ed;
      border-radius: 10px;
      padding: 12px;
      margin-top: 20px;
      font-size: 13px;
      color: #9a3412;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔧 ช่างใกล้ฉัน</div>
  </div>
  <div class="container">
    <div class="card">
      <h1>เข้าสู่ระบบ</h1>
      <p class="subtitle">
        เข้าสู่บัญชีช่างใกล้ฉัน
      </p>
      <form onsubmit="loginUser(event)">
        <label>อีเมล</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        >
        <label>รหัสผ่าน</label>
        <input
          type="password"
          id="password"
          placeholder="กรอกรหัสผ่าน"
          required
        >
        <a href="#" class="forgot" onclick="forgotPassword(event)">
          ลืมรหัสผ่าน?
        </a>
        <button type="submit" class="btn">
          เข้าสู่ระบบ
        </button>
      </form>
      <div class="note">
        🔒 ระบบเข้าสู่ระบบจริงจะเชื่อมต่อกับฐานข้อมูลในขั้นตอนถัดไป
      </div>
      <div class="register">
        ยังไม่มีบัญชี?
        <br>
        <a href="register-customer.html">
          สมัครเป็นลูกค้า
        </a>
        &nbsp; | &nbsp;
        <a href="register-technician.html">
          สมัครเป็นช่าง
        </a>
      </div>
      <a href="index.html" class="back">
        ← กลับหน้าแรก
      </a>
    </div>
  </div>
  <script>
  
    function forgotPassword(event) {
      event.preventDefault();
      alert(
        "ระบบรีเซ็ตรหัสผ่านจะเปิดใช้งานหลังจากเชื่อมฐานข้อมูลจริงครับ"
      );
    }
  </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    window.supabase.createClient(

    );
</script>
</body>
</html>
