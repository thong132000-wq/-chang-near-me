<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ลงทะเบียนช่าง | BP AUTO</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:600px;
    margin:25px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:16px;
}

.gps-box{
    margin-top:20px;
    padding:15px;
    background:#f1f7ff;
    border-radius:10px;
}

.gps-button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:9px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.submit-button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.submit-button:disabled{
    background:#888;
}

#gpsStatus{
    margin-top:12px;
    line-height:1.6;
}

.success{
    display:none;
    margin-top:20px;
    padding:18px;
    background:#e9f8ee;
    border-radius:10px;
    line-height:1.7;
}

.error-box{
    display:none;
    margin-top:20px;
    padding:18px;
    background:#ffecec;
    color:#b00020;
    border-radius:10px;
    line-height:1.6;
}
</style>
</head>

<body>

<header>
    <h1>🔧 BP AUTO</h1>
</header>

<div class="container">

<div class="card">

<h2>ลงทะเบียนช่าง</h2>

<p>
สมัครเป็นช่างในระบบ BP AUTO
เพื่อให้ลูกค้าสามารถค้นหาช่างใกล้ฉันได้
</p>

<label>ชื่อร้าน / ชื่อช่าง</label>

<input
    type="text"
    id="name"
    placeholder="เช่น ช่างสมชาย เซอร์วิส"
>

<label>ประเภทช่าง</label>

<select id="type">

    <option value="">-- เลือกประเภทช่าง --</option>

    <option value="ช่างแอร์">
        ช่างแอร์
    </option>

    <option value="ช่างไฟ">
        ช่างไฟ
    </option>

    <option value="ช่างประปา">
        ช่างประปา
    </option>

    <option value="ช่างซ่อมรถ">
        ช่างซ่อมรถ
    </option>

    <option value="ช่างก่อสร้าง">
        ช่างก่อสร้าง
    </option>

    <option value="ช่างเครื่องใช้ไฟฟ้า">
        ช่างเครื่องใช้ไฟฟ้า
    </option>

    <option value="ช่างอื่น ๆ">
        ช่างอื่น ๆ
    </option>

</select>

<label>จังหวัด</label>

<input
    type="text"
    id="location"
    placeholder="เช่น นนทบุรี"
>

<label>เบอร์โทรศัพท์</label>

<input
    type="tel"
    id="phone"
    placeholder="เช่น 0812345678"
>

<label>LINE</label>

<input
    type="text"
    id="line"
    placeholder="ลิงก์ LINE หรือ ID LINE"
>

<div class="gps-box">

    <strong>📍 ตำแหน่งร้าน / จุดให้บริการ</strong>

    <p>
        กรุณากดปุ่มด้านล่างเพื่อปักตำแหน่งจริง
        ระบบจะใช้ตำแหน่งนี้ในการคำนวณระยะทางให้ลูกค้า
    </p>

    <button
        type="button"
        class="gps-button"
        id="gpsButton"
        onclick="getTechnicianLocation()"
    >
        📍 ปักตำแหน่งของฉัน
    </button>

    <div id="gpsStatus">
        ยังไม่ได้ปักตำแหน่ง
    </div>

</div>

<button
    type="button"
    class="submit-button"
    id="submitButton"
    onclick="registerTechnician()"
>
    สมัครเป็นช่าง
</button>

<div
    id="success"
    class="success"
></div>

<div
    id="errorBox"
    class="error-box"
></div>

</div>

</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://adfnwfdhgqsubmlwdorr.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZm53ZmRoZ3FzdWJtbHdkb3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzA1OTAsImV4cCI6MjEwNDYwNjU5MH0.rOg2FQPhlMXQRtsggPZbTiKxFsh2py3_H2gcLUJEaA8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let latitude = null;
let longitude = null;


/* =========================
   GPS
========================= */

function getTechnicianLocation(){

    const status =
        document.getElementById("gpsStatus");

    if(!navigator.geolocation){

        status.textContent =
            "❌ อุปกรณ์นี้ไม่รองรับ GPS";

        return;
    }

    status.textContent =
        "📍 กำลังค้นหาตำแหน่ง...";

    navigator.geolocation.getCurrentPosition(

        function(position){

            latitude =
                position.coords.latitude;

            longitude =
                position.coords.longitude;

            status.innerHTML =
                "✅ ปักตำแหน่งสำเร็จ<br>" +
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6);

        },

        function(error){

            if(error.code === 1){

                status.textContent =
                    "❌ กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่ง";

            }else if(error.code === 2){

                status.textContent =
                    "❌ ไม่สามารถระบุตำแหน่งได้";

            }else{

                status.textContent =
                    "❌ การค้นหาตำแหน่งหมดเวลา";
            }

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}


/* =========================
   REGISTER
========================= */

async function registerTechnician(){

    const name =
        document.getElementById("name").value.trim();

    const type =
        document.getElementById("type").value;

    const location =
        document.getElementById("location").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const line =
        document.getElementById("line").value.trim();

    const success =
        document.getElementById("success");

    const errorBox =
        document.getElementById("errorBox");

    const submitButton =
        document.getElementById("submitButton");


    success.style.display = "none";
    errorBox.style.display = "none";


    /* ตรวจข้อมูล */

    if(!name){

        alert("กรุณากรอกชื่อร้าน / ชื่อช่าง");

        return;
    }


    if(!type){

        alert("กรุณาเลือกประเภทช่าง");

        return;
    }


    if(!location){

        alert("กรุณากรอกจังหวัด");

        return;
    }


    if(!phone){

        alert("กรุณากรอกเบอร์โทรศัพท์");

        return;
    }


    if(latitude === null ||
       longitude === null){

        alert(
            "กรุณากด 📍 ปักตำแหน่งของฉัน ก่อนลงทะเบียน"
        );

        return;
    }


    /* สร้างข้อมูลช่าง */

    const technician = {

        id:
            "tech-" +
            Date.now(),

        name:
            name,

        type:
            type,

        icon:
            getIcon(type),

        location:
            location,

        latitude:
            latitude,

        longitude:
            longitude,

        rating:
            0,

        reviews:
            0,

        experience:
            0,

        price:
            0,

        phone:
            phone,

        line:
            line
    };


    /* ป้องกันกดซ้ำ */

    submitButton.disabled = true;

    submitButton.textContent =
        "⏳ กำลังบันทึกข้อมูล...";


    try{

        const { error } =
            await supabaseClient
                .from("technicians")
                .insert([
                    technician
                ]);


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            errorBox.style.display =
                "block";

            errorBox.innerHTML =
                "❌ ไม่สามารถบันทึกข้อมูลได้<br><br>" +
                "รายละเอียด: " +
                error.message;

            submitButton.disabled =
                false;

            submitButton.textContent =
                "สมัครเป็นช่าง";

            return;
        }


        /* สำเร็จ */

        success.style.display =
            "block";

        success.innerHTML =
            "✅ สมัครเป็นช่างสำเร็จ!<br><br>" +

            "ชื่อ: " +
            technician.name +

            "<br>" +

            "ประเภท: " +
            technician.type +

            "<br>" +

            "จังหวัด: " +
            technician.location +

            "<br>" +

            "📍 พิกัด: " +

            technician.latitude.toFixed(6) +

            ", " +

            technician.longitude.toFixed(6) +

            "<br><br>" +

            "ข้อมูลถูกบันทึกเข้าสู่ระบบ BP AUTO แล้ว";


        submitButton.textContent =
            "✅ สมัครสำเร็จ";


        /* ล้างฟอร์ม */

        document.getElementById("name").value = "";
        document.getElementById("type").value = "";
        document.getElementById("location").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("line").value = "";

        latitude = null;
        longitude = null;

        document.getElementById("gpsStatus").textContent =
            "ยังไม่ได้ปักตำแหน่ง";


    }catch(error){

        console.error(error);

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            "❌ เกิดข้อผิดพลาดในการเชื่อมต่อ Supabase";

        submitButton.disabled =
            false;

        submitButton.textContent =
            "สมัครเป็นช่าง";
    }

}


/* =========================
   ICON
========================= */

function getIcon(type){

    if(type === "ช่างแอร์")
        return "❄️";

    if(type === "ช่างไฟ")
        return "⚡";

    if(type === "ช่างประปา")
        return "🔧";

    if(type === "ช่างซ่อมรถ")
        return "🚗";

    if(type === "ช่างก่อสร้าง")
        return "🏗️";

    if(type === "ช่างเครื่องใช้ไฟฟ้า")
        return "🔌";

    return "🛠️";
}

</script>

</body>
</html>
