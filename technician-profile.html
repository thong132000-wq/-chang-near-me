<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าร้านช่าง | ช่างใกล้ฉัน</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#172033;
}
header{
    background:#111827;
    color:white;
    padding:16px 20px;
}
.nav{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.logo{
    font-size:22px;
    font-weight:bold;
}
.back{
    color:white;
    text-decoration:none;
    font-size:14px;
}
.container{
    max-width:700px;
    margin:30px auto;
    padding:0 20px;
}
.card{
    background:white;
    border-radius:18px;
    padding:28px 22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}
.profile-top{
    text-align:center;
}
.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin:0 auto 15px;
}
.name{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}
.type{
    color:#f97316;
    font-weight:bold;
    font-size:17px;
}
.rating{
    margin-top:12px;
    font-size:16px;
}
.info-box{
    margin-top:25px;
    border-top:1px solid #e5e7eb;
    padding-top:20px;
}
.info-row{
    padding:10px 0;
    line-height:1.6;
}
.label{
    color:#667085;
    font-size:14px;
}
.value{
    font-weight:bold;
}
.description{
    margin-top:20px;
    background:#f8fafc;
    padding:16px;
    border-radius:12px;
    line-height:1.8;
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}
.stat{
    background:#f8fafc;
    padding:16px;
    border-radius:12px;
    text-align:center;
}
.stat-number{
    font-size:24px;
    font-weight:bold;
}
.stat-label{
    color:#667085;
    font-size:13px;
    margin-top:5px;
}
.buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
}
.btn{
    flex:1;
    border:0;
    border-radius:10px;
    padding:14px;
    color:white;
    font-size:16px;
    font-weight:bold;
    text-decoration:none;
    text-align:center;
    cursor:pointer;
}
.edit{
    background:#111827;
}
.home{
    background:#6b7280;
}
.loading{
    text-align:center;
    padding:40px;
    color:#667085;
}
.error{
    text-align:center;
    padding:30px;
    color:#dc2626;
}
@media(max-width:600px){
    .buttons{
        flex-direction:column;
    }
}
</style>
</head>
<body>
<header>
<div class="nav">
<div class="logo">
🔧 ช่างใกล้ฉัน
</div>
<a href="search.html" class="back">
← กลับค้นหาช่าง
</a>
</div>
</header>
<div class="container">
<div class="card" id="profileCard">
<div class="loading">
กำลังโหลดข้อมูลร้านช่าง...
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
"https://adfnwfdhgqsubmlwdorr.supabase.co";
const SUPABASE_KEY =
"sb_publishable_aWz60lF1KJt-ex5SHsmNpQ_a2SLpDFO";
const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
/* =========================
   อ่าน ID จาก URL
========================= */
const params =
new URLSearchParams(
    window.location.search
);
const technicianId =
params.get("id");
/* =========================
   โหลดหน้าร้าน
========================= */
async function loadProfile(){
    const card =
    document.getElementById(
        "profileCard"
    );
    if(!technicianId){
        card.innerHTML = `
            <div class="error">
                ❌ ไม่พบรหัสช่าง
            </div>
        `;
        return;
    }
    const {
        data: technician,
        error
    } =
    await supabaseClient
        .from("technician_public")
        .select("*")
        .eq("id", technicianId)
        .single();
    if(error || !technician){
        console.error(error);
        card.innerHTML = `
            <div class="error">
                ❌ ไม่พบข้อมูลช่าง
                <br><br>
                กรุณากลับไปค้นหาช่างอีกครั้ง
            </div>
        `;
        return;
    }
    document.title =
        (technician.name || "หน้าร้านช่าง") +
        " | ช่างใกล้ฉัน";
  const {
    data: sessionData
} = await supabaseClient.auth.getSession();

const user =
    sessionData?.session?.user || null;

const isOwner =
    user && user.id === technician.id;
window.contactLine = function(line, name){

    if(!line){

        alert(
            "❌ ช่างรายนี้ยังไม่ได้ระบุ LINE ID"
        );

        return;
    }

    const cleanLine =
        line.replace(/^@/, "").trim();

    const confirmLine =
        confirm(
            "ติดต่อ " +
            name +
            " ผ่าน LINE\n\n" +
            "LINE ID: @" +
            cleanLine +
            "\n\nต้องการเปิด LINE หรือไม่?"
        );

    if(confirmLine){

        window.location.href =
            "https://line.me/R/ti/p/@" +
            encodeURIComponent(cleanLine);
    }
}
    // เพิ่มยอดเข้าชมหน้าร้าน
const { error: viewError } =
    await supabaseClient.rpc(
        "increment_profile_views",
        {
            technician_id: technicianId
        }
    );

if(viewError){
    console.error("ไม่สามารถเพิ่มยอดเข้าชม:", viewError);
}
    card.innerHTML = `
        <div class="profile-top">
            <div class="avatar">
                ${technician.icon || "🔧"}
            </div>
            <div class="name">
                ${technician.name || "ช่างไม่ระบุชื่อ"}
            </div>
            <div class="type">
                ${technician.type || "ช่างทั่วไป"}
            </div>
            <div class="rating">
                ⭐ ${technician.rating ?? 0}
                (${technician.reviews ?? 0} รีวิว)
            </div>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-number">
                    ${technician.reviews ?? 0}
                </div>
                <div class="stat-label">
                    รีวิว
                </div>
            </div>
            <div class="stat">
                <div class="stat-number">
                ${(technician.profile_views ?? 0) + 1}    
                </div>
                <div class="stat-label">
                    เข้าชมโปรไฟล์
                </div>
            </div>
        </div>
        <div class="info-box">
            <div class="info-row">
                <div class="label">
                    📍 พื้นที่ให้บริการ
                </div>
                <div class="value">
                    ${technician.location || "ไม่ระบุ"}
                </div>
            </div>
            <div class="info-row">
                <div class="label">
                    🛠️ ประสบการณ์
                </div>
                <div class="value">
                    ${
                        technician.experience ??
                        0
                    } ปี
                </div>
            </div>
            <div class="info-row">
                <div class="label">
                    💰 ราคาเริ่มต้น
                </div>
                <div class="value">
                    ${
                        technician.price ??
                        0
                    } บาท
                </div>
            </div>
            <div class="info-row">
                <div class="label">
                    📞 เบอร์โทรศัพท์
                </div>
                <div class="value">
                    ${
                        technician.phone ||
                        "ไม่ระบุ"
                    }
                </div>
            </div>
            ${
                technician.phone2
                ?
                `
                <div class="info-row">
                    <div class="label">
                        📞 เบอร์สำรอง
                    </div>
                    <div class="value">
                        ${technician.phone2}
                    </div>
                </div>
                `
                :
                ""
            }
            <div class="info-row">
                <div class="label">
                    💬 LINE
                </div>
                <div class="value">
                    ${
                        technician.line ||
                        "ไม่ระบุ"
                    }
                </div>
            </div>
            ${
                technician.description
                ?
                `
                <div class="description">
                    <strong>
                        📝 รายละเอียดบริการ
                    </strong>
                    <br><br>
                    ${technician.description}
                </div>
                `
                :
                ""
            }
        </div>
      <div class="buttons">

    ${technician.line ? `
        <button
            type="button"
            class="btn"
            style="background:#06c755;"
        onclick="window.location.href='https://line.me/R/ti/p/@' + encodeURIComponent(technician.line.replace(/^@/, '').trim())"
        >
            💬 ติดต่อ LINE
        </button>
    ` : ""}

    ${isOwner ? `
        <a
            href="edit-technician.html"
            class="btn edit"
        >
            ✏️ แก้ไขข้อมูลช่าง
        </a>
    ` : ""}

    <a
        href="search.html"
        class="btn home"
    >
        🔎 ค้นหาช่าง
    </a>
</div>
`;
}

loadProfile();
</script>
</body>
</html>
