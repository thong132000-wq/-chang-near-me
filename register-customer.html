  <script>
    async function registerCustomer(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const province = document.getElementById("province").value;
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("รหัสผ่านไม่ตรงกันครับ");
    return;
  }

  if (password.length < 6) {
    alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษรครับ");
    return;
  }
const { data, error } =
  await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

if (error) {
  alert(
    "❌ สมัครสมาชิกไม่สำเร็จ\n\n" +
    error.message
  );
 return; 
}
  console.log("สมัคร Auth สำเร็จ", data);
const userId = data.user.id;

const { error: customerError } =
  await supabaseClient
    .from("customers")
    .insert([
      {
        id: userId,
        name: name,
        phone: phone,
        province: province
      }
    ]);

if (customerError) {
  console.error("Customer insert error:", customerError);

  alert(
    "❌ สร้างบัญชีลูกค้าสำเร็จ แต่บันทึกข้อมูลลูกค้าไม่สำเร็จ\n\n" +
    customerError.message
  );

  return;
}

alert("✅ สมัครสมาชิกสำเร็จครับ");

window.location.href = "login.html";
  
}
  </script>
