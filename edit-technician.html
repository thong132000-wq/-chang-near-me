<script>
  const SUPABASE_URL =

 <script>
  let map;
  let marker;

  async function loadTechnician() {

  const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData?.session?.user || null;

    if (!user) {

      alert("กรุณาเข้าสู่ระบบก่อนครับ");

      window.location.href = "login.html";

      return;
    }

    const {
      data: technician,
      error
    } =
      await supabaseClient
        .from("technicians")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error) {

      alert(
        "❌ ไม่พบข้อมูลช่างของบัญชีนี้\n\n" +
        error.message
      );

      return;
    }

    document.getElementById("name").value =
      technician.name || "";

    document.getElementById("phone").value =
      technician.phone || "";

    document.getElementById("phone2").value =
      technician.phone2 || "";

    document.getElementById("line").value =
      technician.line || "";

    document.getElementById("category").value =
      technician.type || "";

    document.getElementById("province").value =
      technician.location || "";

    document.getElementById("experience").value =
      technician.experience ?? "";

    document.getElementById("price").value =
      technician.price ?? "";

    document.getElementById("description").value =
      technician.description || "";
document.getElementById("latitude").value =
  technician.latitude ?? "";

document.getElementById("longitude").value =
  technician.longitude ?? "";
if (technician.latitude && technician.longitude) {

  document.getElementById("locationStatus").textContent =

    "✅ มีตำแหน่งช่างบันทึกไว้แล้ว";
}
initMap();
}
  function initMap() {

  const lat =

    document.getElementById("latitude").value;

  const lng =

    document.getElementById("longitude").value;

  let startLat = 13.7367;

  let startLng = 100.5231;

  let zoom = 6;

  if (lat && lng) {

    startLat = Number(lat);

    startLng = Number(lng);

    zoom = 15;

  }

  map = L.map("map").setView(

    [startLat, startLng],

    zoom

  );

  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      attribution:

        "&copy; OpenStreetMap contributors"

    }

  ).addTo(map);

  if (lat && lng) {

    marker = L.marker([

      Number(lat),

      Number(lng)

    ]).addTo(map);

  }

  map.on("click", function(e) {

    const latitude =

      e.latlng.lat;

    const longitude =

      e.latlng.lng;
document.getElementById("latitude").value =

      latitude;

    document.getElementById("longitude").value =

      longitude;
    

    if (marker) {

      marker.setLatLng([

        latitude,

        longitude

      ]);

    } else {

      marker = L.marker([

        latitude,

        longitude

      ]).addTo(map);

    }

    document.getElementById("locationStatus").textContent =

      "✅ เลือกตำแหน่งช่างเรียบร้อยแล้ว";

  });

}

async function getTechnicianLocation() {

  const status =

    document.getElementById("locationStatus");

  if (!navigator.geolocation) {

    status.textContent =

      "❌ อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง";

    return;

  }

  status.textContent =

    "📍 กำลังค้นหาตำแหน่งของคุณ...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =

        position.coords.latitude;

      const longitude =

        position.coords.longitude;
document.getElementById("latitude").value =
  latitude;

document.getElementById("longitude").value =
  longitude;
      
if (map) {

  map.setView(
    [latitude, longitude],
    15
  );

  if (marker) {

    marker.setLatLng([
      latitude,
      longitude
    ]);

  } else {

    marker = L.marker([
      latitude,
      longitude
    ]).addTo(map);

  }

}

status.textContent =
  "✅ ปักตำแหน่งเรียบร้อยแล้ว";
    },

    function(error) {

      status.textContent =

        "❌ ไม่สามารถรับตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง";

    },

    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}

async function updateTechnician(event) {
    event.preventDefault();

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData?.session?.user || null;

    if (!user) {

      alert("กรุณาเข้าสู่ระบบก่อนครับ");

      window.location.href = "login.html";

      return;
    }


    const name =
      document.getElementById("name")
        .value.trim();

    const phone =
      document.getElementById("phone")
        .value.trim();

    const phone2 =
      document.getElementById("phone2")
        .value.trim();

    const line =
      document.getElementById("line")
        .value.trim();

    const category =
      document.getElementById("category")
        .value;

    const province =
      document.getElementById("province")
        .value;

    const experience =
      Number(
        document.getElementById("experience")
          .value
      ) || 0;

    const price =
      Number(
        document.getElementById("price")
          .value
      ) || 0;

    const description =
      document.getElementById("description")
        .value.trim();


const latitude =
  document.getElementById("latitude").value
    ? Number(document.getElementById("latitude").value)
    : null;

const longitude =
  document.getElementById("longitude").value
    ? Number(document.getElementById("longitude").value)
    : null;

    const {
      error
    } =
      await supabaseClient
        .from("technicians")
        .update({

          name: name,

          phone: phone,

          phone2: phone2 || null,

          line: line,

          type: category,

latitude: latitude,

longitude: longitude,

location: province,
          
  experience: experience,
          price: price,

          description: description

        })
        .eq("id", user.id);


    if (error) {

      alert(
        "❌ บันทึกข้อมูลไม่สำเร็จ\n\n" +
        error.message
      );

      return;
    }


    alert(
      "✅ บันทึกข้อมูลช่างเรียบร้อยแล้วครับ"
    );
window.location.href =

    "technician-profile.html?id=" +

    encodeURIComponent(user.id);
  }
   const technicianTypes = [
  "ช่างแอร์",
  "ช่างไฟ",
  "ช่างประปา",
  "ช่างซ่อมรถ",
  "🚗 รถสไลด์",
  "ช่างก่อสร้าง",
  "ช่างทาสี",
  "ช่างเชื่อม",
  "ช่างเฟอร์นิเจอร์",
  "ช่างเครื่องใช้ไฟฟ้า",
  "ช่างอื่น ๆ"
];

const categoryInput = document.getElementById("category");
const categoryDropdown = document.getElementById("categoryDropdown");

function showCategoryDropdown() {
  const keyword = categoryInput.value.trim().toLowerCase();

  const filtered = technicianTypes.filter(type =>
    type.toLowerCase().includes(keyword)
  );

  categoryDropdown.innerHTML = "";

  filtered.forEach(type => {
    const item = document.createElement("div");

    item.textContent = type;

    item.style.cssText = `
      padding:12px 15px;
      cursor:pointer;
      border-bottom:1px solid #eee;
      background:white;
    `;

    item.onclick = function() {
      categoryInput.value = type;
      categoryDropdown.style.display = "none";
    };

    categoryDropdown.appendChild(item);
  });

  categoryDropdown.style.display =
    filtered.length > 0 ? "block" : "none";
}

categoryInput.addEventListener("focus", showCategoryDropdown);

categoryInput.addEventListener("input", showCategoryDropdown);

document.addEventListener("click", function(e) {
  if (
    !categoryInput.contains(e.target) &&
    !categoryDropdown.contains(e.target)
  ) {
    categoryDropdown.style.display = "none";
  }
});
   loadTechnician();
</script>
