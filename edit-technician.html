<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>แก้ไขข้อมูลช่าง | ช่างใกล้ฉัน</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 550px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 5px;
      color: #111827;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: none;
      background: #f97316;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 25px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #374151;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🔧 ช่างใกล้ฉัน</div>
  </div>

  <div class="container">

    <div class="card">

      <h1>แก้ไขข้อมูลช่าง</h1>

      <p class="subtitle">
        แก้ไขข้อมูลโปรไฟล์ของคุณ
      </p>

      <form onsubmit="updateTechnician(event)">

        <div class="section-title">
          👤 ข้อมูลช่าง
        </div>

        <label>ชื่อช่าง / ชื่อร้าน</label>
        <input type="text" id="name" required>

        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" required>

        <label>เบอร์โทรศัพท์สำรอง</label>
        <input type="tel" id="phone2">

        <label>LINE ID</label>
        <input type="text" id="line" required>

        <div class="section-title">
          🔧 ข้อมูลการให้บริการ
        </div>

        <label>ประเภทช่าง</label>

        <select id="category" required>

          <option value="">-- เลือกประเภทช่าง --</option>

          <option>ช่างแอร์</option>
          <option>ช่างไฟ</option>
          <option>ช่างประปา</option>
          <option>ช่างซ่อมรถ</option>
          <option>🚗 รถสไลด์</option>
          <option>ช่างก่อสร้าง</option>
          <option>ช่างทาสี</option>
          <option>ช่างเชื่อม</option>
          <option>ช่างเฟอร์นิเจอร์</option>
          <option>ช่างเครื่องใช้ไฟฟ้า</option>
          <option>ช่างอื่น ๆ</option>

        </select>

        <label>จังหวัดที่ให้บริการ</label>

        <select id="province" required>

          <option value="">-- เลือกจังหวัด --</option>

          <option>กรุงเทพมหานคร</option>
          <option>นนทบุรี</option>
          <option>ปทุมธานี</option>
          <option>สมุทรปราการ</option>
          <option>นครปฐม</option>
          <option>สมุทรสาคร</option>
          <option>พระนครศรีอยุธยา</option>
          <option>ชลบุรี</option>
          <option>เชียงใหม่</option>
          <option>นครราชสีมา</option>
          <option>ขอนแก่น</option>
          <option>อุดรธานี</option>
          <option>อุบลราชธานี</option>
          <option>ศรีสะเกษ</option>
          <option>อื่น ๆ</option>

        </select>

        <label>ประสบการณ์</label>

        <select id="experience">

          <option value="">-- เลือกประสบการณ์ --</option>
          <option value="0">น้อยกว่า 1 ปี</option>
          <option value="1">1 - 3 ปี</option>
          <option value="3">3 - 5 ปี</option>
          <option value="5">5 - 10 ปี</option>
          <option value="10">มากกว่า 10 ปี</option>

        </select>

        <label>ราคาเริ่มต้นต่อครั้ง</label>

        <input
          type="number"
          id="price"
          min="0"
        >

        <label>แนะนำตัว / รายละเอียดบริการ</label>

        <textarea id="description"></textarea>

        <button type="submit" class="btn">
          💾 บันทึกข้อมูล
        </button>

      </form>

      <a href="index.html" class="back">
        ← กลับหน้าแรก
      </a>

    </div>

  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://adfnwfdhgqsubmlwdorr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_aWz60lF1KJt-ex5SHsmNpQ_a2SLpDFO";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
</script>
<script>

  async function loadTechnician() {

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData?.session?.user || null;

    if (!user) {

      alert("กรุณาเข้าสู่ระบบก่อนครับ");

      window.location.href = "login.html";

      return;
    }

    const {
      data: technician,
      error
    } =
      await supabaseClient
        .from("technicians")
        .select("*")
        .eq("id", user.id)
        .single();

    if (error) {

      alert(
        "❌ ไม่พบข้อมูลช่างของบัญชีนี้\n\n" +
        error.message
      );

      return;
    }

    document.getElementById("name").value =
      technician.name || "";

    document.getElementById("phone").value =
      technician.phone || "";

    document.getElementById("phone2").value =
      technician.phone2 || "";

    document.getElementById("line").value =
      technician.line || "";

    document.getElementById("category").value =
      technician.type || "";

    document.getElementById("province").value =
      technician.location || "";

    document.getElementById("experience").value =
      technician.experience ?? "";

    document.getElementById("price").value =
      technician.price ?? "";

    document.getElementById("description").value =
      technician.description || "";
  }


  loadTechnician();
  async function updateTechnician(event) {

    event.preventDefault();

    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    const user =
      sessionData?.session?.user || null;

    if (!user) {

      alert("กรุณาเข้าสู่ระบบก่อนครับ");

      window.location.href = "login.html";

      return;
    }


    const name =
      document.getElementById("name")
        .value.trim();

    const phone =
      document.getElementById("phone")
        .value.trim();

    const phone2 =
      document.getElementById("phone2")
        .value.trim();

    const line =
      document.getElementById("line")
        .value.trim();

    const category =
      document.getElementById("category")
        .value;

    const province =
      document.getElementById("province")
        .value;

    const experience =
      Number(
        document.getElementById("experience")
          .value
      ) || 0;

    const price =
      Number(
        document.getElementById("price")
          .value
      ) || 0;

    const description =
      document.getElementById("description")
        .value.trim();


    const {
      error
    } =
      await supabaseClient
        .from("technicians")
        .update({

          name: name,

          phone: phone,

          phone2: phone2 || null,

          line: line,

          type: category,

          location: province,

          experience: experience,

          price: price,

          description: description

        })
        .eq("id", user.id);


    if (error) {

      alert(
        "❌ บันทึกข้อมูลไม่สำเร็จ\n\n" +
        error.message
      );

      return;
    }


    alert(
      "✅ บันทึกข้อมูลช่างเรียบร้อยแล้วครับ"
    );

  }
</script>
</body>
</html>
