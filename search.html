<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หาช่าง | ช่างใกล้ฉัน</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:16px 20px;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#667085;
    margin-bottom:25px;
}

.search-box{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 22px;
    background:#f97316;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.results-title{
    font-size:21px;
    margin-bottom:15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:14px;
}

.name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:5px;
}

.type{
    color:#f97316;
    font-weight:bold;
    margin-bottom:12px;
}

.info{
    color:#667085;
    font-size:14px;
    line-height:1.8;
}

.price{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.card-buttons button{
    flex:1;
    padding:11px 8px;
}

.profile{
    background:#111827;
}

.empty{
    display:none;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#667085;
}

@media(max-width:800px){

    .search-box{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

    h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
🔧 ช่างใกล้ฉัน
</div>

<a href="index.html" class="back">
← กลับหน้าแรก
</a>

</div>

</header>


<div class="container">

<h1>ค้นหาช่าง</h1>

<p class="subtitle">
ค้นหาช่างที่คุณต้องการในพื้นที่ใกล้บ้าน
</p>


<div class="search-box">

<input
type="text"
id="keyword"
placeholder="เช่น ช่างแอร์ ช่างไฟ ช่างประปา"
>

<select id="location">

<option value="">ทุกพื้นที่</option>
<option value="กรุงเทพมหานคร">กรุงเทพมหานคร</option>
<option value="นนทบุรี">นนทบุรี</option>
<option value="ปทุมธานี">ปทุมธานี</option>
<option value="สมุทรปราการ">สมุทรปราการ</option>

</select>

<button onclick="search()">🔎 ค้นหาช่าง</button>

</div>


<h2 class="results-title">
ช่างแนะนำ
</h2>


<div class="cards" id="cards">

<div class="empty" id="empty">

ไม่พบช่างที่ตรงกับการค้นหา

</div>

</div>




<script>

let technicians = [];

async function loadTechnicians() {

    try {

        const response =
            await fetch("technicians.json");

        technicians =
            await response.json();

        renderTechnicians();

    } catch (error) {

        console.error(
            "ไม่สามารถโหลดข้อมูลช่างได้",
            error
        );

    }

}


function renderTechnicians() {

    const cards =
        document.getElementById("cards");

    cards.innerHTML = "";

    technicians.forEach(technician => {

        const card =
            document.createElement("div");

        card.className =
            "card technician";

        card.dataset.type =
            technician.type;

        card.dataset.location =
            technician.location;

        card.innerHTML = `

            <div class="avatar">
                ${technician.icon}
            </div>

            <div class="name">
                ${technician.name}
            </div>

            <div class="type">
                ${technician.type}
            </div>

            <div class="info">
                ⭐ ${technician.rating}
                (${technician.reviews} รีวิว)<br>

                📍 ${technician.location}<br>

                🛠️ ประสบการณ์
                ${technician.experience} ปี
            </div>

            <div class="price">
                เริ่มต้น ${technician.price} บาท
            </div>

            <div class="card-buttons">

                <button
                    class="profile"
                    onclick="viewProfile('${technician.id}')">
                    ดูโปรไฟล์
                </button>

                <button
                    onclick="contact('${technician.name}')">
                    ติดต่อ
                </button>

            </div>

        `;

        cards.appendChild(card);

    });

    search();

}


function search(){

    const keyword =
        document.getElementById("keyword")
        .value
        .trim()
        .toLowerCase();

    const location =
        document.getElementById("location")
        .value;


    const cards =
        document.querySelectorAll(".technician");

    let found = 0;


    cards.forEach(card => {

        const type =
            card.dataset.type
            .toLowerCase();

        const cardLocation =
            card.dataset.location;


        const keywordMatch =
            !keyword ||
            type.includes(keyword);


        const locationMatch =
            !location ||
            cardLocation === location;


        if (
            keywordMatch &&
            locationMatch
        ){

            card.style.display =
                "block";

            found++;

        }else{

            card.style.display =
                "none";

        }

    });


    document.getElementById("empty")
        .style.display =
            found === 0
                ? "block"
                : "none";

}


function viewProfile(id){

    if(id === "somchai"){

        window.location.href =
            "technician-somchai.html";

    }

    else if(id === "prasit"){

        window.location.href =
            "technician-prasit.html";

    }

    else if(id === "wattana"){

        window.location.href =
            "technician-wattana.html";

    }

}


function contact(name){

    alert(
        "ติดต่อ " +
        name +
        "\n\nระบบโทร / LINE / แชต\n" +
        "จะเชื่อมต่อในขั้นตอนถัดไป"
    );

}


loadTechnicians();

</script>
</body>
</html>
