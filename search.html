<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หาช่าง | ช่างใกล้ฉัน</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:16px 20px;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#667085;
    margin-bottom:25px;
}

.search-box{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
    margin-bottom:15px;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-size:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 22px;
    background:#f97316;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.gps-box{
    background:white;
    padding:18px 20px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    margin-bottom:30px;
}

.gps-button{
    background:#16a34a;
}

.gps-status{
    margin-top:10px;
    color:#667085;
    font-size:14px;
}

.results-title{
    font-size:21px;
    margin-bottom:15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:14px;
}

.name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:5px;
}

.type{
    color:#f97316;
    font-weight:bold;
    margin-bottom:12px;
}

.info{
    color:#667085;
    font-size:14px;
    line-height:1.8;
}

.price{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

.distance{
    margin-top:8px;
    color:#16a34a;
    font-weight:bold;
    font-size:14px;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.card-buttons button{
    flex:1;
    padding:11px 8px;
}

.profile{
    background:#111827;
}

.empty{
    display:none;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#667085;
    grid-column:1/-1;
}

@media(max-width:800px){

    .search-box{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

    h1{
        font-size:25px;
    }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
🔧 ช่างใกล้ฉัน
</div>

<a href="index.html" class="back">
← กลับหน้าแรก
</a>

</div>

</header>


<div class="container">

<h1>ค้นหาช่าง</h1>

<p class="subtitle">
ค้นหาช่างที่คุณต้องการ หรือค้นหาช่างที่อยู่ใกล้คุณ
</p>


<div class="search-box">

<input
type="text"
id="keyword"
placeholder="เช่น ช่างแอร์ ช่างไฟ ช่างประปา"
>

<select id="location">

<option value="">ทุกจังหวัด</option>

</select>

<button onclick="search()">
🔎 ค้นหาช่าง
</button>

</div>


<div class="gps-box">

<button
class="gps-button"
onclick="getMyLocation()"
>
📍 ใช้ตำแหน่งของฉัน
</button>

<div
class="gps-status"
id="gpsStatus"
>
ยังไม่ได้เปิดใช้งานตำแหน่ง GPS
</div>

</div>


<h2 class="results-title">
ช่างแนะนำ
</h2>


<div class="cards" id="cards">

</div>

<div
class="empty"
id="empty"
>
ไม่พบช่างที่ตรงกับการค้นหา
</div>


</div>


<script>

let technicians = [];

let userLatitude = null;
let userLongitude = null;


/* =========================
   โหลดข้อมูลช่าง
========================= */

async function loadTechnicians(){

    try{

        const response =
            await fetch("technicians.json");

        if(!response.ok){

            throw new Error(
                "ไม่พบ technicians.json"
            );

        }

        technicians =
            await response.json();

        createProvinceList();

        renderTechnicians();

    }catch(error){

        console.error(
            "ไม่สามารถโหลดข้อมูลช่างได้",
            error
        );

        document.getElementById(
            "gpsStatus"
        ).textContent =
            "❌ ไม่สามารถโหลดข้อมูลช่างได้";

    }

}


/* =========================
   สร้างรายชื่อจังหวัด
========================= */

function createProvinceList(){

    const select =
        document.getElementById(
            "location"
        );

    const provinces =
        [
            ...new Set(
                technicians
                .map(
                    technician =>
                        technician.location
                )
                .filter(Boolean)
            )
        ].sort();

    provinces.forEach(
        province => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                province;

            option.textContent =
                province;

            select.appendChild(
                option
            );

        }
    );

}


/* =========================
   แสดงช่าง
========================= */

function renderTechnicians(){

    const cards =
        document.getElementById(
            "cards"
        );

    cards.innerHTML = "";

    technicians.forEach(
        technician => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card technician";

            card.dataset.type =
                technician.type || "";

            card.dataset.name =
                technician.name || "";

            card.dataset.location =
                technician.location || "";

            card.dataset.latitude =
                technician.latitude ?? "";

            card.dataset.longitude =
                technician.longitude ?? "";


            card.innerHTML = `

                <div class="avatar">
                    ${technician.icon || "🔧"}
                </div>

                <div class="name">
                    ${technician.name || "ช่างไม่ระบุชื่อ"}
                </div>

                <div class="type">
                    ${technician.type || "ช่างทั่วไป"}
                </div>

                <div class="info">

                    ⭐ ${technician.rating ?? "-"}
                    (${technician.reviews ?? 0} รีวิว)

                    <br>

                    📍 ${technician.location || "ไม่ระบุพื้นที่"}

                    <br>

                    🛠️ ประสบการณ์
                    ${technician.experience ?? "-"} ปี

                </div>

                <div class="price">
                    เริ่มต้น
                    ${technician.price ?? "-"}
                    บาท
                </div>

                <div class="distance"></div>

                <div class="card-buttons">

                    <button
                        class="profile"
                        onclick="viewProfile('${technician.id}')"
                    >
                        ดูโปรไฟล์
                    </button>

                    <button
                        onclick="contact('${technician.name || ""}')"
                    >
                        ติดต่อ
                    </button>

                </div>

            `;

            cards.appendChild(
                card
            );

        }
    );

    search();

}


/* =========================
   ค้นหาช่าง
========================= */

function search(){

    const keyword =
        document.getElementById(
            "keyword"
        )
        .value
        .trim()
        .toLowerCase();


    const location =
        document.getElementById(
            "location"
        ).value;


    const cards =
        [
            ...document.querySelectorAll(
                ".technician"
            )
        ];


    let results = [];


    cards.forEach(
        card => {

            const type =
                card.dataset.type
                .toLowerCase();


            const name =
                card.dataset.name
                .toLowerCase();


            const cardLocation =
                card.dataset.location;


            const keywordMatch =

                !keyword ||

                type.includes(keyword) ||

                name.includes(keyword) ||

                cardLocation
                    .toLowerCase()
                    .includes(keyword);


            const locationMatch =

                !location ||

                cardLocation === location;


            if(
                keywordMatch &&
                locationMatch
            ){

                results.push(card);

            }else{

                card.style.display =
                    "none";

            }

        }
    );


    /* =========================
       ถ้าเปิด GPS
       เรียงจากใกล้ที่สุด
    ========================= */

    if(
        userLatitude !== null &&
        userLongitude !== null
    ){

        results.forEach(
            card => {

                const lat =
                    parseFloat(
                        card.dataset.latitude
                    );

                const lon =
                    parseFloat(
                        card.dataset.longitude
                    );


                if(
                    Number.isFinite(lat) &&
                    Number.isFinite(lon)
                ){

                    const distance =
                        calculateDistance(
                            userLatitude,
                            userLongitude,
                            lat,
                            lon
                        );


                    card.dataset.distance =
                        distance;


                    card.querySelector(
                        ".distance"
                    ).textContent =

                        "📍 ห่างจากคุณ " +
                        distance.toFixed(1) +
                        " กม.";

                }else{

                    card.dataset.distance =
                        "999999";


                    card.querySelector(
                        ".distance"
                    ).textContent =

                        "📍 ยังไม่มีพิกัดช่าง";

                }

            }
        );


        results.sort(
            (a,b) =>

                parseFloat(
                    a.dataset.distance
                )

                -

                parseFloat(
                    b.dataset.distance
                )
        );

    }


    /* =========================
       ถ้ายังไม่เปิด GPS
       เรียงตามคะแนน
    ========================= */

    else{

        results.sort(
            (a,b) => {

                const ratingA =
                    getRating(a);

                const ratingB =
                    getRating(b);

                return ratingB - ratingA;

            }
        );

    }


    const cardsContainer =
        document.getElementById(
            "cards"
        );


    results.forEach(
        card => {

            card.style.display =
                "block";

            cardsContainer.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "empty"
    ).style.display =

        results.length === 0
            ? "block"
            : "none";

}


/* =========================
   อ่านคะแนน
========================= */

function getRating(card){

    const text =
        card.querySelector(
            ".info"
        ).textContent;


    const match =
        text.match(
            /⭐\s*([\d.]+)/
        );


    return match
        ? parseFloat(match[1])
        : 0;

}


/* =========================
   GPS
========================= */

function getMyLocation(){

    const status =
        document.getElementById(
            "gpsStatus"
        );


    if(
        !navigator.geolocation
    ){

        status.textContent =
            "❌ อุปกรณ์นี้ไม่รองรับ GPS";

        return;

    }


    status.textContent =
        "📍 กำลังค้นหาตำแหน่งของคุณ...";


    navigator.geolocation.getCurrentPosition(

        function(position){

            userLatitude =
                position.coords.latitude;

            userLongitude =
                position.coords.longitude;


            status.textContent =

                "✅ เปิดใช้งานตำแหน่งแล้ว " +

                "(ความแม่นยำประมาณ " +

                Math.round(
                    position.coords.accuracy
                ) +

                " เมตร)";


            search();

        },


        function(error){

            if(
                error.code === 1
            ){

                status.textContent =
                    "❌ คุณไม่อนุญาตให้เว็บไซต์ใช้ตำแหน่ง";

            }

            else if(
                error.code === 2
            ){

                status.textContent =
                    "❌ ไม่สามารถระบุตำแหน่งได้";

            }

            else{

                status.textContent =
                    "❌ การค้นหาตำแหน่งหมดเวลา";

            }

        },


        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


/* =========================
   คำนวณระยะทาง
========================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            toRadians(lat1)
        )

        *

        Math.cos(
            toRadians(lat2)
        )

        *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =

        2 *

        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


function toRadians(degrees){

    return degrees *
        Math.PI /
        180;

}


/* =========================
   ดูโปรไฟล์
========================= */

function viewProfile(id){

    window.location.href =

        "profile.html?id=" +

        encodeURIComponent(id);

}


/* =========================
   ระบบติดต่อเดิม
========================= */

function contact(name){

    alert(

        "ติดต่อ " +
        name +

        "\n\nระบบโทร / LINE / แชต\n" +

        "จะเชื่อมต่อในขั้นตอนถัดไป"

    );

}


/* =========================
   เริ่มต้น
========================= */

loadTechnicians();

</script>

</body>
</html>
